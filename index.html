<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbfa;
            --text-color: #1a1a1a;
            --accent-color: #8c7a6b;
            --border-color: #e6e3df;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Menu Hambúrguer */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
        }

        .menu-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: var(--text-color);
            transition: 0.3s;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--bg-color);
            border-right: 1px solid var(--border-color);
            z-index: 999;
            transition: 0.3s ease;
            padding: 80px 20px 20px 20px;
            box-shadow: 2px 0 10px var(--shadow-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .album-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .album-item {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .album-item:hover {
            background-color: var(--border-color);
        }

        .delete-album-btn {
            background: none;
            border: none;
            color: #cc0000;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 5px;
        }

        /* Layout Principal */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        header p {
            font-weight: 300;
            color: #666;
            margin-bottom: 40px;
        }

        .main-btn {
            font-family: 'Inter', sans-serif;
            background-color: var(--text-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 2px;
        }

        .main-btn:hover {
            background-color: var(--accent-color);
        }

        /* Editor do Álbum */
        #editor-section {
            display: none;
            margin-top: 40px;
        }

        .page-builder {
            background: white;
            border: 1px solid var(--border-color);
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .preview-img {
            max-width: 100%;
            max-height: 300px;
            object-fit: cover;
            display: none;
            margin: 10px auto;
            border-radius: 2px;
        }

        .custom-file-btn {
            display: inline-block;
            padding: 10px 20px;
            border: 1px dashed var(--accent-color);
            color: var(--accent-color);
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .custom-file-btn:hover {
            background-color: #faf8f5;
        }

        .caption-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 10px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            text-align: center;
            outline: none;
            font-size: 1.1rem;
            resize: none;
        }

        .editor-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .secondary-btn {
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 12px 25px;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .secondary-btn:hover {
            background-color: var(--text-color);
            color: white;
        }

        /* Link de Compartilhamento */
        #share-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #f3f0ec;
            border-radius: 4px;
        }

        /* Animação do Livro Abrindo */
        #intro-animation-section {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .book-animation {
            width: 120px;
            height: 90px;
            position: relative;
            perspective: 600px;
            margin-bottom: 30px;
        }

        .book-page {
            width: 60px;
            height: 90px;
            background-color: white;
            position: absolute;
            top: 0;
            right: 0;
            transform-origin: left center;
            border: 1px solid var(--border-color);
            border-left: none;
            animation: flip 2s infinite ease-in-out;
            border-radius: 0 4px 4px 0;
        }

        .book-page:nth-child(2) { animation-delay: 0.3s; }
        .book-page:nth-child(3) { animation-delay: 0.6s; }

        @keyframes flip {
            0% { transform: rotateY(0deg); z-index: 1; }
            50% { transform: rotateY(-180deg); z-index: 10; }
            100% { transform: rotateY(-180deg); z-index: 1; }
        }

        .intro-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            text-align: center;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 1.5s forwards 0.5s;
        }

        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
</body>
</html>
