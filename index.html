<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbfa;
            --text-color: #1a1a1a;
            --accent-color: #8c7a6b;
            --border-color: #e6e3df;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
        }

        .menu-btn span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: var(--text-color);
            transition: 0.3s;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--bg-color);
            border-right: 1px solid var(--border-color);
            z-index: 999;
            transition: 0.3s ease;
            padding: 80px 20px 20px 20px;
            box-shadow: 2px 0 10px var(--shadow-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .album-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .album-item {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .album-item:hover {
            background-color: var(--border-color);
        }

        .delete-album-btn {
            background: none;
            border: none;
            color: #cc0000;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 5px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        header p {
            font-weight: 300;
            color: #666;
            margin-bottom: 40px;
        }

        .main-btn {
            font-family: 'Inter', sans-serif;
            background-color: var(--text-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 2px;
        }

        .main-btn:hover {
            background-color: var(--accent-color);
        }

        #editor-section {
            display: none;
            margin-top: 40px;
        }

        .page-builder {
            background: white;
            border: 1px solid var(--border-color);
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .preview-img {
            max-width: 100%;
            max-height: 300px;
            object-fit: cover;
            display: none;
            margin: 10px auto;
            border-radius: 2px;
        }

        .custom-file-btn {
            display: inline-block;
            padding: 10px 20px;
            border: 1px dashed var(--accent-color);
            color: var(--accent-color);
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .custom-file-btn:hover {
            background-color: #faf8f5;
        }

        .caption-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 10px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            text-align: center;
            outline: none;
            font-size: 1.1rem;
            resize: none;
        }

        .editor-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .secondary-btn {
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 12px 25px;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .secondary-btn:hover {
            background-color: var(--text-color);
            color: white;
        }

        #share-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #f3f0ec;
            border-radius: 4px;
        }

        #intro-animation-section {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .book-animation {
            width: 120px;
            height: 90px;
            position: relative;
            perspective: 600px;
            margin-bottom: 30px;
        }

        .book-page {
            width: 60px;
            height: 90px;
            background-color: white;
            position: absolute;
            top: 0;
            right: 0;
            transform-origin: left center;
            border: 1px solid var(--border-color);
            border-left: none;
            animation: flip 2s infinite ease-in-out;
            border-radius: 0 4px 4px 0;
        }

        .book-page:nth-child(2) { animation-delay: 0.3s; }
        .book-page:nth-child(3) { animation-delay: 0.6s; }

        @keyframes flip {
            0% { transform: rotateY(0deg); z-index: 1; }
            50% { transform: rotateY(-180deg); z-index: 10; }
            100% { transform: rotateY(-180deg); z-index: 1; }
        }

        .intro-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            text-align: center;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 1.5s forwards 0.5s;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        #viewer-section {
            display: none;
            margin: 40px auto;
            max-width: 700px;
            position: relative;
        }

        .flip-book {
            width: 100%;
            height: 450px;
            background: white;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px var(--shadow-color);
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            padding: 10px;
        }

        .view-page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .view-page.active {
            opacity: 1;
            pointer-events: auto;
        }

        .view-img {
            max-width: 100%;
            max-height: 280px;
            object-fit: cover;
            margin-bottom: 25px;
            border-radius: 2px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
        }

        .view-caption {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            text-align: center;
            word-wrap: break-word;
            width: 100%;
            line-height: 1.5;
        }

        .nav-arrows {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .arrow-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-color);
        }

        @media (max-width: 600px) {
            .container { padding-top: 120px; }
            .flip-book { height: 380px; }
        }
    </style>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="Abrir menu">
    <span></span>
    <span></span>
    <span></span>
</button>

<aside class="sidebar" id="sidebar">
    <h2>Álbuns</h2>
    <ul class="album-list" id="albumList">
        <li class="album-item">Álbum de Exemplo <button class="delete-album-btn" title="Excluir">Excluir</button></li>
    </ul>
    <button class="secondary-btn" id="closeSidebar">Fechar</button>
</aside>

<main class="container">
    <header>
        <h1>Nossa História</h1>
        <p>Crie e compartilhe memórias em um livro virtual.</p>
    </header>

    <button class="main-btn" id="openViewer">Abrir Livro</button>

    <section id="intro-animation-section">
        <div class="book-animation">
            <div class="book-page"></div>
            <div class="book-page"></div>
            <div class="book-page"></div>
        </div>
        <div class="intro-text">Bem-vindo ao seu livro de memórias. Clique em "Abrir Livro" para começar.</div>
        <button class="secondary-btn" id="closeIntro">Continuar</button>
    </section>

    <section id="viewer-section">
        <div class="flip-book" id="flipBook">
            <div class="view-page active" data-index="0">
                <img class="view-img" src="https://via.placeholder.com/600x280?text=Foto+1" alt="Foto 1">
                <div class="view-caption">Legenda da foto 1</div>
            </div>
            <div class="view-page" data-index="1">
                <img class="view-img" src="https://via.placeholder.com/600x280?text=Foto+2" alt="Foto 2">
                <div class="view-caption">Legenda da foto 2</div>
            </div>
            <div class="view-page" data-index="2">
                <img class="view-img" src="https://via.placeholder.com/600x280?text=Foto+3" alt="Foto 3">
                <div class="view-caption">Legenda da foto 3</div>
            </div>
        </div>

        <div class="nav-arrows">
            <button class="arrow-btn" id="prevBtn" aria-label="Página anterior">◀</button>
            <button class="arrow-btn" id="nextBtn" aria-label="Próxima página">▶</button>
        </div>
    </section>

    <section id="share-section">
        <p>Compartilhe este livro copiando o link abaixo:</p>
        <input type="text" readonly value="" id="shareLink" style="width:100%;padding:8px;border:1px solid var(--border-color);border-radius:4px;">
    </section>
</main>

<script>
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const openViewer = document.getElementById('openViewer');
    const viewerSection = document.getElementById('viewer-section');
    const introSection = document.getElementById('intro-animation-section');
    const closeIntro = document.getElementById('closeIntro');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pages = Array.from(document.querySelectorAll('.view-page'));
    let current = 0;

    function safe(el) {
        return el !== null && typeof el !== 'undefined';
    }

    if (safe(menuBtn) && safe(sidebar)) {
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });
    }

    if (safe(closeSidebar) && safe(sidebar)) {
        closeSidebar.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });
    }

    if (safe(openViewer) && safe(introSection) && safe(viewerSection)) {
        openViewer.addEventListener('click', () => {
            introSection.style.display = 'flex';
            viewerSection.style.display = 'none';
        });
    }

    if (safe(closeIntro) && safe(introSection) && safe(viewerSection)) {
        closeIntro.addEventListener('click', () => {
            introSection.style.display = 'none';
            viewerSection.style.display = 'block';
            const shareInput = document.getElementById('shareLink');
            if (shareInput) shareInput.value = location.href;
        });
    }

    function showPage(index) {
        if (!pages || pages.length === 0) return;
        if (index < 0) index = 0;
        if (index >= pages.length) index = pages.length - 1;
        pages.forEach(page => page.classList.remove('active'));
        pages[index].classList.add('active');
        current = index;
    }

    if (safe(prevBtn)) {
        prevBtn.addEventListener('click', () => showPage(current - 1));
    }

    if (safe(nextBtn)) {
        nextBtn.addEventListener('click', () => showPage(current + 1));
    }

    document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') showPage(current - 1);
        if (event.key === 'ArrowRight') showPage(current + 1);
        if (event.key === 'Escape' && safe(sidebar)) sidebar.classList.remove('active');
    });

    window.addEventListener('load', () => {
        if (introSection) introSection.style.display = 'none';
        if (viewerSection) viewerSection.style.display = 'none';
        showPage(0);
    });
</script>

</body>
</html>
